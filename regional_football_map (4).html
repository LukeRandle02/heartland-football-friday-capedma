<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Heartland Football Friday Atlas 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --turf-dark:#12241B; --turf:#1C3527; --turf-light:#274A37;
    --line:rgba(244,241,232,.14); --chalk:#F4F1E8; --chalk-dim:#A9BDAE;
    --amber:#E2A33B; --il:#5B8FB9; --mo:#C1543C; --ky:#CDA531; --tn:#E4813C;
    --err:#C1543C; --win:#6FA87A; --loss:#C15C4A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--turf-dark);color:var(--chalk);font-family:'Public Sans',sans-serif;display:flex;flex-direction:column;}

  header{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;background:linear-gradient(180deg,var(--turf) 0%,var(--turf-dark) 100%);flex-shrink:0;}
  .title-block h1{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:clamp(20px,3.3vw,32px);letter-spacing:.3px;margin:0;text-transform:uppercase;line-height:1;}
  .title-block h1 .year{color:var(--amber);font-weight:700;}
  .title-block p{margin:5px 0 0;color:var(--chalk-dim);font-size:13px;letter-spacing:.3px;}
  .byline{margin:3px 0 0;color:var(--chalk-dim);font-size:11px;letter-spacing:.4px;font-style:italic;}

  .tabs{display:flex;gap:0;padding:0 22px;background:var(--turf-dark);border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto;}
  .tab-btn{background:none;border:none;color:var(--chalk-dim);font-family:'Public Sans',sans-serif;font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase;padding:12px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s;}
  .tab-btn:hover{color:var(--chalk);}
  .tab-btn.active{color:var(--amber);border-bottom-color:var(--amber);}
  .tab-btn:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;}

  .data-status{display:none;margin:14px 22px;padding:12px 16px;border-radius:8px;font-size:13px;line-height:1.5;flex-shrink:0;}
  .data-status.loading{display:block;background:var(--turf);border:1px solid var(--line);color:var(--chalk-dim);}
  .data-status.error{display:block;background:rgba(193,84,60,.16);border:1px solid var(--err);color:var(--chalk);}
  .data-status code{background:rgba(244,241,232,.1);padding:1px 5px;border-radius:4px;font-family:'Space Mono',monospace;font-size:12px;}

  .view{display:none;flex:1;min-height:0;flex-direction:column;}
  .view.active{display:flex;}

  /* shared toolbar + scroll */
  .tab-toolbar{border-bottom:1px solid var(--line);background:var(--turf-dark);flex-shrink:0;}
  .week-nav{display:flex;gap:8px;padding:12px 22px 8px;overflow-x:auto;}
  .week-nav a{flex-shrink:0;font-family:'Public Sans',sans-serif;font-weight:600;font-size:12.5px;color:var(--chalk);background:var(--turf);border:1px solid var(--line);padding:6px 14px;border-radius:16px;text-decoration:none;display:flex;align-items:center;gap:6px;}
  .week-nav a:hover{background:var(--turf-light);}
  .week-nav a.current{border-color:var(--amber);color:var(--amber);}
  .week-nav a .dot{width:8px;height:8px;border-radius:50%;}
  .tab-scroll{flex:1;overflow-y:auto;padding:20px 22px 60px;scroll-behavior:smooth;}

  /* map */
  .controls{display:flex;align-items:center;gap:8px;padding:12px 22px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--turf-dark);flex-shrink:0;}
  .controls .label{font-size:11px;letter-spacing:1px;color:var(--chalk-dim);text-transform:uppercase;margin-right:4px;flex-shrink:0;}
  .chip{flex-shrink:0;display:flex;align-items:center;gap:7px;background:var(--turf);border:1px solid var(--line);color:var(--chalk);font-family:'Public Sans',sans-serif;font-weight:600;font-size:13px;padding:7px 13px 7px 10px;border-radius:20px;cursor:pointer;transition:background .15s,opacity .15s;}
  .chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .chip[aria-pressed="false"]{opacity:.35;}
  .chip:hover{background:var(--turf-light);}
  .chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .count{margin-left:auto;flex-shrink:0;font-family:'Space Mono',monospace;font-size:12px;color:var(--chalk-dim);padding-left:10px;}
  #map{flex:1;background:var(--turf-dark);}
  .leaflet-tile-pane{filter:invert(93%) hue-rotate(175deg) brightness(.94) contrast(.88) saturate(.55);}
  .pin{width:13px;height:13px;border-radius:50%;border:2px solid var(--turf-dark);box-shadow:0 0 0 2px rgba(244,241,232,.28);}
  .pin-il{background:var(--il);}.pin-mo{background:var(--mo);}.pin-ky{background:var(--ky);}.pin-tn{background:var(--tn);}
  .leaflet-popup-content-wrapper{background:var(--turf);color:var(--chalk);border-radius:8px;border:1px solid var(--line);}
  .leaflet-popup-tip{background:var(--turf);border:1px solid var(--line);}
  .leaflet-popup-content{margin:12px 14px;}
  .leaflet-popup-close-button{color:var(--chalk-dim) !important;}
  .pop-name{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;}
  .pop-name a{color:var(--chalk);text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:3px;cursor:pointer;}
  .pop-name a:hover{color:var(--amber);}
  .pop-loc{font-size:12px;color:var(--chalk-dim);letter-spacing:.4px;}
  .pop-sched-hint{font-size:11px;color:var(--amber);margin-top:6px;letter-spacing:.2px;}
  .pop-note{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--turf-dark);background:var(--amber);padding:2px 8px;border-radius:10px;margin-top:7px;}
  .leaflet-control-attribution{background:rgba(18,36,27,.85) !important;color:var(--chalk-dim) !important;}
  .leaflet-control-attribution a{color:var(--chalk-dim) !important;}

  /* schedules */
  .sched-search-row{padding:0 22px 12px;}
  .sched-search{width:100%;max-width:420px;background:var(--turf);border:1px solid var(--line);color:var(--chalk);font-family:'Public Sans',sans-serif;font-size:13px;padding:8px 14px;border-radius:20px;outline:none;}
  .sched-search::placeholder{color:var(--chalk-dim);}
  .sched-search:focus{border-color:var(--amber);}
  .sched-search:disabled{opacity:.5;cursor:not-allowed;}
  .no-results{color:var(--chalk-dim);font-family:'Public Sans',sans-serif;font-size:14px;padding:10px 0 20px;}
  .state-section{margin-bottom:36px;scroll-margin-top:10px;}
  .state-section h2{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:26px;text-transform:uppercase;margin:0 0 4px;padding-left:12px;border-left:5px solid var(--amber);}
  .state-il h2{border-color:var(--il);}.state-mo h2{border-color:var(--mo);}.state-ky h2{border-color:var(--ky);}.state-tn h2{border-color:var(--tn);}
  .county-group{margin:22px 0 0 12px;scroll-margin-top:10px;}
  .county-group h3{font-family:'Public Sans',sans-serif;font-weight:700;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--chalk-dim);margin:0 0 10px;padding-bottom:6px;border-bottom:1px dashed var(--line);}
  .school-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:18px;}
  .school-card{background:var(--turf);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .school-card h4{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;margin:0 0 2px;letter-spacing:.2px;}
  .card-loc{font-size:11px;color:var(--chalk-dim);letter-spacing:.3px;margin-bottom:8px;}
  .search-meta{font-family:'Space Mono',monospace;font-size:12px;color:var(--chalk-dim);margin:0 0 14px;}
  .coop-badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--turf-dark);background:var(--amber);padding:1px 7px;border-radius:9px;margin-bottom:8px;}
  .sched-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
  .sched-table td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top;}
  .sched-table tr:last-child td{border-bottom:none;}
  .sched-table .c-date{font-family:'Space Mono',monospace;color:var(--chalk-dim);white-space:nowrap;padding-right:10px;width:1%;}
  .sched-table .c-opp{color:var(--chalk);}
  .sched-table .c-time{font-family:'Space Mono',monospace;color:var(--chalk-dim);text-align:right;white-space:nowrap;padding-left:10px;}
  .sched-table .note{display:block;font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:.3px;}

  /* result badges */
  .result{font-family:'Space Mono',monospace;font-weight:700;}
  .result-win{color:var(--win);}
  .result-loss{color:var(--loss);}

  /* this week + scoreboard shared game-row */
  .week-section{margin-bottom:28px;scroll-margin-top:10px;}
  .week-section h2{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:10px;letter-spacing:.3px;}
  .this-week-badge{font-family:'Public Sans',sans-serif;font-weight:700;font-size:10px;letter-spacing:.5px;text-transform:uppercase;background:var(--amber);color:var(--turf-dark);padding:3px 9px;border-radius:10px;}
  .game-list{display:flex;flex-direction:column;gap:4px;}
  .game-row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:8px 12px;background:var(--turf);border:1px solid var(--line);border-radius:6px;font-size:13px;}
  .game-date{font-family:'Space Mono',monospace;color:var(--chalk-dim);font-size:11px;}
  .game-matchup b{font-family:'Big Shoulders Display',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.2px;font-size:13px;}
  .game-matchup span{color:var(--chalk-dim);margin-left:5px;font-size:12.5px;}
  .game-result{text-align:right;white-space:nowrap;font-family:'Space Mono',monospace;font-size:12px;color:var(--chalk-dim);}

  /* this week tab */
  .tw-header{padding:16px 22px 0;flex-shrink:0;}
  .tw-week-label{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:28px;text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:12px;}
  .tw-sub{font-size:12px;color:var(--chalk-dim);margin-top:4px;font-family:'Public Sans',sans-serif;}
  .tw-empty{color:var(--chalk-dim);padding:20px 0;font-size:14px;}

  /* standings */
  .standings-section{margin-bottom:32px;}
  .standings-section h2{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase;margin:0 0 10px;padding-left:12px;border-left:5px solid var(--amber);letter-spacing:.3px;}
  .standings-section.state-il h2{border-color:var(--il);}
  .standings-section.state-mo h2{border-color:var(--mo);}
  .standings-section.state-ky h2{border-color:var(--ky);}
  .standings-section.state-tn h2{border-color:var(--tn);}
  .standings-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:22px;}
  .standings-table th{font-family:'Public Sans',sans-serif;font-weight:700;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--chalk-dim);padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;}
  .standings-table th.num{text-align:right;}
  .standings-table td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .standings-table tr:last-child td{border-bottom:none;}
  .standings-table .s-rank{font-family:'Space Mono',monospace;color:var(--chalk-dim);font-size:11px;text-align:right;width:24px;}
  .standings-table .s-name{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.2px;}
  .standings-table .s-num{font-family:'Space Mono',monospace;text-align:right;width:36px;}
  .standings-table .s-pct{font-family:'Space Mono',monospace;text-align:right;width:44px;color:var(--chalk-dim);}
  .win-num{color:var(--win);}
  .loss-num{color:var(--loss);}
  .standings-note{font-size:12px;color:var(--chalk-dim);margin:-14px 0 20px;font-family:'Public Sans',sans-serif;}

  .game-row-regional{border-color:rgba(226,163,59,.25);}
  .game-at{color:var(--chalk-dim);margin:0 4px;font-family:'Public Sans',sans-serif;font-weight:400;font-size:12px;text-transform:none;letter-spacing:0;}


  .hl-week{margin-bottom:30px;}
  .hl-week h2{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:10px;letter-spacing:.3px;}
  .hl-grid{display:flex;flex-direction:column;gap:8px;}
  .hl-card{display:flex;align-items:flex-start;gap:14px;background:var(--turf);border:1px solid var(--line);border-radius:8px;padding:13px 15px;text-decoration:none;color:var(--chalk);transition:background .15s,border-color .15s;}
  .hl-card:hover{background:var(--turf-light);border-color:var(--amber);}
  .hl-thumb{width:88px;height:58px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--turf-light);}
  .hl-icon{flex-shrink:0;width:58px;height:58px;border-radius:6px;background:var(--err);display:flex;align-items:center;justify-content:center;}
  .hl-icon svg{width:22px;height:22px;fill:var(--chalk);}
  .hl-body{flex:1;min-width:0;}
  .hl-title{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.2px;line-height:1.2;margin-bottom:4px;}
  .hl-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .hl-source{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:var(--err);color:var(--chalk);padding:2px 7px;border-radius:8px;}
  .hl-date{font-family:'Space Mono',monospace;font-size:11px;color:var(--chalk-dim);}
  .hl-note{font-size:12px;color:var(--chalk-dim);margin-top:3px;}
  .hl-arrow{flex-shrink:0;color:var(--chalk-dim);font-size:18px;align-self:center;}
  .hl-empty{color:var(--chalk-dim);font-size:14px;padding:20px 0;}
  .hl-setup{background:var(--turf);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-size:13px;line-height:1.6;margin-bottom:20px;}
  .hl-setup code{background:rgba(244,241,232,.1);padding:1px 5px;border-radius:4px;font-family:'Space Mono',monospace;font-size:12px;}

  /* YouTube embed */
  .hl-section-title{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.3px;margin:28px 0 10px;padding-left:10px;border-left:4px solid var(--err);}
  .hl-yt-wrap{position:relative;width:100%;max-width:720px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin-bottom:8px;}
  .hl-yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
  .hl-yt-sub{font-size:12px;color:var(--chalk-dim);margin-bottom:4px;}
  .hl-yt-sub a{color:var(--amber);text-decoration:none;}
  .hl-yt-sub a:hover{text-decoration:underline;}

  /* social links */
  .hl-social-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;}
  .hl-social-btn{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;text-decoration:none;font-family:'Public Sans',sans-serif;font-weight:700;font-size:13px;transition:opacity .15s;}
  .hl-social-btn:hover{opacity:.82;}
  .hl-social-btn svg{width:18px;height:18px;flex-shrink:0;}
  .hl-social-kfvs{background:#C1543C;color:var(--chalk);}
  .hl-social-yt{background:#FF0000;color:#fff;}
  .hl-social-fb{background:#1877F2;color:#fff;}
  .hl-social-x{background:#000;color:#fff;}
  .hl-social-ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;}
  .hl-divider{border:none;border-top:1px solid var(--line);margin:24px 0 0;}

  /* directory */
  .dir-contact-card{background:var(--turf);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:24px;max-width:560px;}
  .dir-contact-name{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
  .dir-contact-title{font-size:13px;color:var(--chalk-dim);letter-spacing:.3px;margin-bottom:14px;}
  .dir-contact-row{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:8px;}
  .dir-contact-row:last-child{margin-bottom:0;}
  .dir-contact-row svg{width:15px;height:15px;fill:var(--amber);flex-shrink:0;}
  .dir-contact-row a{color:var(--chalk);text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:3px;}
  .dir-contact-row a:hover{color:var(--amber);}
  .dir-pitch{font-size:13.5px;line-height:1.65;color:var(--chalk-dim);max-width:560px;margin-bottom:32px;padding:16px 18px;background:var(--turf);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;}
  .dir-ad-header{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:.3px;margin:0 0 16px;padding-left:12px;border-left:5px solid var(--amber);}
  .dir-state-block{margin-bottom:28px;}
  .dir-state-block h3{font-family:'Public Sans',sans-serif;font-weight:700;font-size:14px;letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px;padding-bottom:6px;border-bottom:1px dashed var(--line);}
  .dir-state-block.state-mo h3{color:var(--mo);}
  .dir-state-block.state-il h3{color:var(--il);}
  .dir-state-block.state-ky h3{color:var(--ky);}
  .dir-state-block.state-tn h3{color:var(--tn);}
  .dir-coming-soon{font-size:13px;color:var(--chalk-dim);font-style:italic;padding:6px 0;}

    header{padding:14px 16px;} .controls{padding:10px 16px;}
    .week-nav,.tab-scroll,.sched-search-row,.tw-header{padding-left:16px;padding-right:16px;}
    .game-row{grid-template-columns:40px 1fr auto;gap:8px;padding:7px 10px;font-size:12px;}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
    .tab-scroll{scroll-behavior:auto;}
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Heartland Football Friday Atlas <span class="year">2026</span></h1>
    <p>Southeast Missouri · Southern Illinois · Western Kentucky · Northwest Tennessee</p>
    <p class="byline">Created by Luke Randle</p>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="thisweek">This Week</button>
  <button class="tab-btn" data-tab="schedules">Schedules</button>
  <button class="tab-btn" data-tab="scores">Scoreboard</button>
  <button class="tab-btn" data-tab="standings">Standings</button>
  <button class="tab-btn" data-tab="highlights">Highlights</button>
  <button class="tab-btn" data-tab="map">Map</button>
  <button class="tab-btn" data-tab="directory">Directory</button>
</nav>

<div id="dataStatus" class="data-status"></div>

<!-- THIS WEEK -->
<div id="view-thisweek" class="view active">
  <div class="tw-header">
    <div class="tw-week-label" id="twLabel">Loading…</div>
    <div class="tw-sub" id="twSub"></div>
  </div>
  <div class="tab-scroll" id="twContent"></div>
</div>

<!-- SCHEDULES -->
<div id="view-schedules" class="view">
  <div class="tab-toolbar">
    <div class="week-nav" id="schedJump"></div>
    <div class="sched-search-row">
      <input type="text" id="schedSearch" class="sched-search" placeholder="Search schools, counties, or opponents…" autocomplete="off" disabled />
    </div>
  </div>
  <div class="tab-scroll" id="schedContent">
    <p id="noResults" class="no-results" style="display:none;">No schools or opponents match your search.</p>
    <p id="searchMeta" class="search-meta" style="display:none;"></p>
    <div id="searchResults"></div>
    <div id="browseView"></div>
  </div>
</div>

<!-- SCOREBOARD -->
<div id="view-scores" class="view">
  <div class="tab-toolbar">
    <div class="week-nav" id="weekJump"></div>
  </div>
  <div class="tab-scroll" id="scoresContent"></div>
</div>

<!-- STANDINGS -->
<div id="view-standings" class="view">
  <div class="tab-scroll" id="standingsContent"></div>
</div>

<!-- HIGHLIGHTS -->
<div id="view-highlights" class="view">
  <div class="tab-scroll" id="highlightsContent"></div>
</div>

<!-- MAP -->
<div id="view-map" class="view">
  <div class="controls">
    <span class="label">Filter</span>
    <button class="chip" data-state="MO" aria-pressed="true"><span class="dot" style="background:var(--mo)"></span><span class="chip-label">Missouri</span></button>
    <button class="chip" data-state="IL" aria-pressed="true"><span class="dot" style="background:var(--il)"></span><span class="chip-label">Illinois</span></button>

<script>
/* =====================================================================
   DATA SOURCE — published Google Sheet CSV link
   Required columns: School, State, County, Coop, Lat, Lng,
                     Date, Opponent, Loc, Time, Note
   Optional columns: TeamScore, OppScore  (fill in after each game)
   ===================================================================== */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSp5jvaDIeWBbrAFl7vrSWd0hyYsu0Sif6MjA4hR7Ry5vq9-tCT0DJaEqR1kaYGbanvjYteUDvy4TAg/pub?output=csv";

/* Publish your Videos sheet tab as a separate CSV and paste the link below.
   Required columns: Date, Title, URL, Source, Note (Note is optional)       */
const VIDEOS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSp5jvaDIeWBbrAFl7vrSWd0hyYsu0Sif6MjA4hR7Ry5vq9-tCT0DJaEqR1kaYGbanvjYteUDvy4TAg/pub?gid=2071401492&single=true&output=csv";

let schools = [];
const stateOrder = ["MO","IL","KY","TN"];
const stateNames = {IL:"Illinois",MO:"Missouri",KY:"Kentucky",TN:"Tennessee"};
const dayAbbr = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* ---- helpers ---- */
function setStatus(kind,msg){
  const el=document.getElementById('dataStatus');
  el.className='data-status'+(kind?' '+kind:'');
  el.innerHTML=msg||'';
}
function normLoc(v){
  const t=(v||'').trim().toUpperCase();
  if(t==='H'||t==='HOME'||t==='VS') return 'H';
  if(t==='A'||t==='AWAY'||t==='@') return 'A';
  return 'N';
}
function parseScore(v){
  const t=(v||'').trim();
  if(t==='') return null;
  const n=Number(t);
  return isNaN(n)?null:n;
}
function rowsToSchools(rows){
  const map=new Map();
  rows.forEach(raw=>{
    const r={};
    Object.keys(raw).forEach(k=>{r[k.trim()]=raw[k];});
    const name=(r.School||'').trim();
    if(!name) return;
    if(!map.has(name)){
      map.set(name,{
        name,
        state:(r.State||'').trim().toUpperCase(),
        county:(r.County||'').trim(),
        coop:/^(true|yes|y|1)$/i.test((r.Coop||'').trim()),
        lat:parseFloat(r.Lat),lng:parseFloat(r.Lng),g:[]
      });
    }
    const s=map.get(name);
    const date=(r.Date||'').trim();
    if(date){
      s.g.push([date,(r.Opponent||'').trim(),normLoc(r.Loc),(r.Time||'').trim(),(r.Note||'').trim(),parseScore(r.TeamScore),parseScore(r.OppScore)]);
    }
  });
  return Array.from(map.values());
}
const MONTH_NAMES={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseMD(md){
  if(!md) return null;
  md=md.trim();
  // M/D format
  if(/^\d{1,2}\/\d{1,2}$/.test(md)){
    const p=md.split('/').map(Number);
    return {m:p[0],d:p[1]};
  }
  // "Month D" or "D Month" format
  const parts=md.replace(/[,]/g,'').split(/\s+/);
  for(let i=0;i<parts.length;i++){
    const mon=MONTH_NAMES[parts[i].toLowerCase()];
    if(mon){
      const day=parseInt(parts[1-i+(i===0?1:0)])||parseInt(parts[i===0?1:0]);
      if(day) return {m:mon,d:day};
    }
  }
  return null;
}
function dateMs(md){
  const p=parseMD(md);
  if(!p) return 0;
  return new Date(2026,p.m-1,p.d).getTime();
}
function fmtDate(md){
  const p=parseMD(md);
  if(!p) return md;
  const dt=new Date(2026,p.m-1,p.d);
  return `${dayAbbr[dt.getDay()]} ${p.m}/${p.d}`;
}
function resultOrTime(ts,os,time){
  if(ts===null||os===null||ts===undefined||os===undefined||isNaN(ts)||isNaN(os)) return time;
  let cls,letter;
  if(ts>os){cls='win';letter='W';}
  else if(ts<os){cls='loss';letter='L';}
  else return time; // equal scores treated as not yet final
  return `<span class="result result-${cls}">${letter} ${ts}\u2013${os}</span>`;
}
function weekStart(md){
  const dt=new Date(dateMs(md));
  const sun=new Date(dt);
  sun.setDate(dt.getDate()-dt.getDay());
  sun.setHours(0,0,0,0);
  return sun.getTime();
}
function weekLabel(wk){
  const s=new Date(wk),e=new Date(wk);
  e.setDate(s.getDate()+6);
  const f=d=>`${d.getMonth()+1}/${d.getDate()}`;
  return `${f(s)} \u2013 ${f(e)}`;
}
function buildGameRow(schoolName,md,opp,loc,ts,os,time){
  const row=document.createElement('div');
  row.className='game-row';
  const oppStr=loc==='H'?`vs. ${opp}`:(loc==='A'?`@ ${opp}`:opp);
  row.innerHTML=`<span class="game-date">${fmtDate(md)}</span><span class="game-matchup"><b>${schoolName}</b><span>${oppStr}</span></span><span class="game-result">${resultOrTime(ts,os,time)}</span>`;
  return row;
}

/* ---- header scoreboard removed; counts now live only in map chip labels ---- */
function updateScoreboard(){}
function updateChipLabels(){
  const counts={};
  schools.forEach(s=>{counts[s.state]=(counts[s.state]||0)+1;});
  document.querySelectorAll('.controls .chip').forEach(chip=>{
    const st=chip.dataset.state;
    chip.querySelector('.chip-label').textContent=`${stateNames[st]||st} (${counts[st]||0})`;
  });
}

/* ---- week key shared across tabs ---- */
let currentWeekKey=null;
function computeCurrentWeek(games){
  const weekKeys=Array.from(new Set(games.map(g=>g.wk))).sort((a,b)=>a-b);
  if(!weekKeys.length) return null;
  const now=Date.now();
  let wk=weekKeys[0];
  weekKeys.forEach(k=>{if(k<=now) wk=k;});
  return wk;
}

/* ---- flatten all games ---- */
function allGames(){
  const out=[];
  schools.forEach(s=>{
    (s.g||[]).forEach(row=>{
      const[md,opp,loc,time,note,ts,os]=row;
      out.push({school:s,md,opp,loc,time,note,ts,os,wk:weekStart(md),ms:dateMs(md)});
    });
  });
  return out;
}

/* ========== THIS WEEK TAB ========== */
function buildThisWeek(){
  const container=document.getElementById('twContent');
  const label=document.getElementById('twLabel');
  const sub=document.getElementById('twSub');
  container.innerHTML='';

  const games=allGames();
  currentWeekKey=computeCurrentWeek(games);
  if(currentWeekKey===null){
    label.textContent='No games found';
    return;
  }

  const thisGames=games.filter(g=>g.wk===currentWeekKey).sort((a,b)=>a.ms-b.ms||a.school.name.localeCompare(b.school.name));

  /* Deduplicate regional matchups using auto-detection */
  const emitted=new Set();
  const deduped=[];
  thisGames.forEach(g=>{
    const oppCanon=resolveTracked(g.opp);
    if(oppCanon){
      const key=pairKey(g.school.name, oppCanon);
      if(emitted.has(key)) return;
      emitted.add(key);
      const [away,home]=getAwayHome(g.school.name, oppCanon, g.loc);
      let ts=null,os=null;
      if(g.school.name===away){ ts=g.ts; os=g.os; }
      else { ts=g.os; os=g.ts; }
      if(ts===null||os===null){
        const mirror=thisGames.find(x=>
          x.school.name.toLowerCase()===oppCanon.toLowerCase()&&
          resolveTracked(x.opp)===g.school.name
        );
        if(mirror){
          if(g.school.name===away){ ts=mirror.os; os=mirror.ts; }
          else { ts=mirror.ts; os=mirror.os; }
        }
      }
      const hasScore=ts!==null&&os!==null;
      deduped.push({ms:g.ms,played:hasScore,el:buildRegionalGameRow(away,home,g.md,ts,os,g.time)});
    } else {
      const hasScore=g.ts!==null&&g.os!==null;
      deduped.push({ms:g.ms,played:hasScore,el:buildGameRow(g.school.name,g.md,g.opp,g.loc,g.ts,g.os,g.time)});
    }
  });

  const played=deduped.filter(r=>r.played);
  const upcoming=deduped.filter(r=>!r.played);

  label.innerHTML=`${weekLabel(currentWeekKey)} <span class="this-week-badge">This Week</span>`;
  sub.textContent=`${deduped.length} matchups · ${played.length} final · ${upcoming.length} upcoming`;

  if(!deduped.length){
    container.innerHTML='<p class="tw-empty">No games this week.</p>';
    return;
  }

  if(played.length){
    const ph2=document.createElement('h3');
    ph2.style.cssText='font-family:"Big Shoulders Display",sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--chalk-dim);margin:12px 0 8px;';
    ph2.textContent='Final';
    container.appendChild(ph2);
    const pl=document.createElement('div');
    pl.className='game-list';
    played.sort((a,b)=>a.ms-b.ms).forEach(r=>pl.appendChild(r.el));
    container.appendChild(pl);
  }

  if(upcoming.length){
    const uh2=document.createElement('h3');
    uh2.style.cssText='font-family:"Big Shoulders Display",sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--chalk-dim);margin:20px 0 8px;';
    uh2.textContent='Upcoming';
    container.appendChild(uh2);
    const ul=document.createElement('div');
    ul.className='game-list';
    upcoming.sort((a,b)=>a.ms-b.ms).forEach(r=>ul.appendChild(r.el));
    container.appendChild(ul);
  }
  appendMediaSections(container);
}

/* ========== SCHEDULES TAB ========== */
function schoolId(name){
  return 'school-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
function buildCard(s){
  const card=document.createElement('div');
  card.className='school-card';
  card.id=schoolId(s.name);
  let html=`<h4>${s.name}</h4><div class="card-loc">${s.county} Co., ${s.state}</div>`;
  if(s.coop) html+=`<span class="coop-badge">Co-op</span>`;
  html+=`<table class="sched-table"><tbody>`;
  (s.g||[]).forEach(row=>{
    const[md,opp,loc,time,note,ts,os]=row;
    const oppStr=loc==='H'?`vs. ${opp}`:(loc==='A'?`@ ${opp}`:opp);
    html+=`<tr><td class="c-date">${fmtDate(md)}</td><td class="c-opp">${oppStr}${note?`<span class="note">${note}</span>`:''}</td><td class="c-time">${resultOrTime(ts,os,time)}</td></tr>`;
  });
  html+=`</tbody></table>`;
  card.innerHTML=html;
  return card;
}
function buildSchedules(){
  const container=document.getElementById('browseView');
  const jump=document.getElementById('schedJump');
  container.innerHTML='';jump.innerHTML='';
  stateOrder.forEach(st=>{
    const stSch=schools.filter(s=>s.state===st);
    if(!stSch.length) return;
    const section=document.createElement('section');
    section.className=`state-section state-${st.toLowerCase()}`;
    section.id=`${st.toLowerCase()}-sched`;
    const h2=document.createElement('h2');
    h2.textContent=stateNames[st]||st;
    section.appendChild(h2);
    const counties=[];
    stSch.forEach(s=>{if(!counties.includes(s.county)) counties.push(s.county);});
    counties.forEach(co=>{
      const group=document.createElement('div');
      group.className='county-group';
      const h3=document.createElement('h3');
      h3.textContent=`${co} County`;
      group.appendChild(h3);
      const grid=document.createElement('div');
      grid.className='school-grid';
      stSch.filter(s=>s.county===co).forEach(s=>grid.appendChild(buildCard(s)));
      group.appendChild(grid);
      section.appendChild(group);
    });
    container.appendChild(section);
    const link=document.createElement('a');
    link.href=`#${st.toLowerCase()}-sched`;
    link.innerHTML=`<span class="dot" style="background:var(--${st.toLowerCase()})"></span>${stateNames[st]||st}`;
    jump.appendChild(link);
  });
  appendMediaSections(document.getElementById('schedContent'));
}
function scoreMatch(s,q){
  const name=s.name.toLowerCase(),county=s.county.toLowerCase();
  if(name.startsWith(q)) return 4;
  if(name.includes(q)) return 3;
  if(county.includes(q)) return 2;
  if((s.g||[]).map(r=>r[1]).join(' ').toLowerCase().includes(q)) return 1;
  return 0;
}
document.getElementById('schedSearch').addEventListener('input',e=>{
  const raw=e.target.value.trim(),q=raw.toLowerCase();
  const bv=document.getElementById('browseView'),sr=document.getElementById('searchResults');
  const sm=document.getElementById('searchMeta'),nr=document.getElementById('noResults');
  const jump=document.getElementById('schedJump');
  if(!q){
    bv.style.display='';jump.style.display='';
    sr.style.display='none';sr.innerHTML='';
    sm.style.display='none';nr.style.display='none';
    return;
  }
  bv.style.display='none';jump.style.display='none';
  const matches=schools.map(s=>({s,score:scoreMatch(s,q)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.s.name.localeCompare(b.s.name));
  if(!matches.length){sr.style.display='none';sr.innerHTML='';sm.style.display='none';nr.style.display='block';return;}
  nr.style.display='none';
  sm.style.display='block';
  sm.textContent=`${matches.length} result${matches.length===1?'':'s'} for "${raw}"`;
  sr.style.display='';sr.innerHTML='';
  const grid=document.createElement('div');grid.className='school-grid';
  matches.forEach(({s})=>grid.appendChild(buildCard(s)));
  sr.appendChild(grid);
});

/* ========== SCOREBOARD TAB ========== */
/* ---- canonical name map: normalises sheet spelling variants to match school names ---- */
const CANON={
  /* West Frankfort */
  'west frankfort':'West Frankfort / Frankfort Comm.',
  'west frankfort/frankfort comm.':'West Frankfort / Frankfort Comm.',
  'frankfort community':'West Frankfort / Frankfort Comm.',
  /* Sikeston */
  'sikston':'Sikeston',
  /* Massac County */
  'massachusetts county':'Massac County',
  'massac co.':'Massac County',
  /* Obion County Central */
  'obion county':'Obion County Central',
  'obion co. central':'Obion County Central',
  /* Central Cape Girardeau */
  'cape central':'Central (Cape Girardeau)',
  'central-cape girardeau':'Central (Cape Girardeau)',
  'cape girardeau central':'Central (Cape Girardeau)',
  /* Mt. Vernon */
  'mt. vernon':'Mt. Vernon Twp.',
  'mt. vernon twp.':'Mt. Vernon Twp.',
  'mt vernon':'Mt. Vernon Twp.',
  'mount vernon':'Mt. Vernon Twp.',
  /* CZRE */
  'czre':'Christopher-Zeigler-Royalton-Elverado',
  'christopher-zeigler-royalton-elverado':'Christopher-Zeigler-Royalton-Elverado',

  'sesser-valier':'Sesser-Valier/Waltonville',
  'sesser valier':'Sesser-Valier/Waltonville',
  'sesser-valier/waltonville':'Sesser-Valier/Waltonville',
  'sesser valier waltonville':'Sesser-Valier/Waltonville',
  /* Fulton County KY */
  'fulton county ky':'Fulton County',
  'fulton county (ky)':'Fulton County',
  /* Scott City/Chaffee */
  'scott city':'Scott City/Chaffee',
  'scott city-chaffee':'Scott City/Chaffee',
  'scott city with chaffee':'Scott City/Chaffee',
  'scott city/chaffee':'Scott City/Chaffee',
  /* New Madrid County Central */
  'new madrid county central':'New Madrid County Central',
  'central (new madrid county)':'New Madrid County Central',
  'new madrid central':'New Madrid County Central',
  /* Vienna-Goreville */
  'vienna-goreville':'Vienna-Goreville',
  'vienna-goreville coop':'Vienna-Goreville',
  'vienna coop':'Vienna-Goreville',
  'vienna goreville':'Vienna-Goreville',

  'anna-jonesboro':'Anna-Jonesboro',
  'anna jonesboro':'Anna-Jonesboro',

};
function canon(name){
  const k=(name||'').trim().toLowerCase();
  return CANON[k]||name.trim();
}

/* ---- set of all tracked school names (lowercase → canonical) ---- */
let _trackedLower=null;
function trackedLower(){
  if(!_trackedLower) _trackedLower=new Map(schools.map(s=>[s.name.toLowerCase(),s.name]));
  return _trackedLower;
}
function trackedSet(){
  return new Set(schools.map(s=>s.name));
}

/* Auto-detect if an opponent is a tracked school after canon normalisation.
   Returns the canonical school name or null. */
function resolveTracked(oppName){
  const c=canon(oppName);
  const tl=trackedLower();
  return tl.get(c.toLowerCase())||null;
}

/* Determine away/home from the Loc field; fall back to treating
   this school as away if Loc is missing or neutral. */
function getAwayHome(schoolName, oppCanon, loc){
  if(loc==='H') return [oppCanon, schoolName];   // school is home → opp is away
  return [schoolName, oppCanon];                  // school is away (A or N)
}

/* Build a regional game row — both names bold/uppercase */
function buildRegionalGameRow(awayName, homeName, md, ts, os, time){
  const row=document.createElement('div');
  row.className='game-row game-row-regional';
  row.innerHTML=`<span class="game-date">${fmtDate(md)}</span><span class="game-matchup"><b>${awayName}</b><span class="game-at"> @ </span><b>${homeName}</b></span><span class="game-result">${resultOrTime(ts,os,time)}</span>`;
  return row;
}

/* Stable dedup key for a regional pair — always AWAY|HOME alphabetically
   so it doesn't matter which team's row we process first */
function pairKey(a,b){ return [a,b].sort().join('|||'); }

function buildScoresTab(){
  const container=document.getElementById('scoresContent');
  const jump=document.getElementById('weekJump');
  container.innerHTML='';jump.innerHTML='';
  _trackedLower=null; // reset cache so it rebuilds after data loads
  const games=allGames();
  if(!games.length) return;

  const weekKeys=Array.from(new Set(games.map(g=>g.wk))).sort((a,b)=>a-b);

  weekKeys.forEach(wk=>{
    const isCurrent=wk===currentWeekKey;
    const weekGames=games.filter(g=>g.wk===wk).sort((a,b)=>a.ms-b.ms||a.school.name.localeCompare(b.school.name));

    const emitted=new Set();
    const rows=[];

    weekGames.forEach(g=>{
      const oppCanon=resolveTracked(g.opp);

      if(oppCanon){
        // Regional matchup — both teams tracked
        const key=pairKey(g.school.name, oppCanon);
        if(emitted.has(key)) return;
        emitted.add(key);

        const [away,home]=getAwayHome(g.school.name, oppCanon, g.loc);

        // Scores: from this row, adjusted for perspective
        let ts=null,os=null;
        if(g.school.name===away){ ts=g.ts; os=g.os; }
        else { ts=g.os; os=g.ts; }

        // If scores missing, try the mirror row
        if(ts===null||os===null){
          const mirror=weekGames.find(x=>
            x.school.name.toLowerCase()===oppCanon.toLowerCase()&&
            resolveTracked(x.opp)===g.school.name
          );
          if(mirror){
            if(g.school.name===away){ ts=mirror.os; os=mirror.ts; }
            else { ts=mirror.ts; os=mirror.os; }
          }
        }
        rows.push({ms:g.ms, el:buildRegionalGameRow(away,home,g.md,ts,os,g.time)});
      } else {
        // Non-regional — standard row
        rows.push({ms:g.ms, el:buildGameRow(g.school.name,g.md,g.opp,g.loc,g.ts,g.os,g.time)});
      }
    });

    if(!rows.length) return;

    const section=document.createElement('section');
    section.className='week-section';
    section.id=`wk-${wk}`;
    const h2=document.createElement('h2');
    h2.innerHTML=weekLabel(wk)+(isCurrent?' <span class="this-week-badge">This Week</span>':'');
    section.appendChild(h2);
    const list=document.createElement('div');
    list.className='game-list';
    rows.sort((a,b)=>a.ms-b.ms).forEach(r=>list.appendChild(r.el));
    section.appendChild(list);
    container.appendChild(section);

    const link=document.createElement('a');
    link.href=`#wk-${wk}`;
    link.textContent=weekLabel(wk);
    if(isCurrent) link.classList.add('current');
    jump.appendChild(link);
  });
  appendMediaSections(container);
}
function buildStandings(){
  const container=document.getElementById('standingsContent');
  container.innerHTML='';

  const records=new Map();
  schools.forEach(s=>{
    let w=0,l=0,t=0,pf=0,pa=0;
    (s.g||[]).forEach(row=>{
      const[,,,,,ts,os]=row;
      if(ts===null||os===null||ts===undefined||os===undefined||isNaN(ts)||isNaN(os)) return;
      pf+=ts;pa+=os;
      if(ts>os) w++;
      else if(ts<os) l++;
      else t++;
    });
    records.set(s.name,{s,w,l,t,pf,pa,gp:w+l+t});
  });

  const note=document.createElement('p');
  note.className='standings-note';
  note.style.cssText='padding:10px 0 4px;';
  note.textContent='Standings within region regardless of class/district. These do not have an effect on playoff qualification.';
  container.appendChild(note);

  stateOrder.forEach(st=>{
    const stSch=schools.filter(s=>s.state===st);
    if(!stSch.length) return;

    const section=document.createElement('section');
    section.className=`standings-section state-${st.toLowerCase()}`;
    const h2=document.createElement('h2');
    h2.textContent=stateNames[st]||st;
    section.appendChild(h2);

    const rows=[...stSch].sort((a,b)=>{
      const ra=records.get(a.name),rb=records.get(b.name);
      if(rb.w!==ra.w) return rb.w-ra.w;
      const pcta=ra.gp?ra.w/ra.gp:0,pctb=rb.gp?rb.w/rb.gp:0;
      if(pctb!==pcta) return pctb-pcta;
      return (rb.pf-rb.pa)-(ra.pf-ra.pa);
    });

    const table=document.createElement('table');
    table.className='standings-table';
    table.innerHTML=`<thead><tr>
      <th class="num">#</th>
      <th>School</th>
      <th class="num">W</th>
      <th class="num">L</th>
      <th class="num">PCT</th>
      <th class="num">PF</th>
      <th class="num">PA</th>
    </tr></thead><tbody></tbody>`;
    const tbody=table.querySelector('tbody');

    rows.forEach((s,i)=>{
      const rec=records.get(s.name);
      const pct=rec.gp?( rec.w/rec.gp).toFixed(3).replace(/^0/,''):'.000';
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td class="s-rank">${rec.gp?i+1:'–'}</td>
        <td class="s-name">${s.name}<div style="font-size:10px;font-family:'Public Sans',sans-serif;font-weight:400;color:var(--chalk-dim);text-transform:none;letter-spacing:0;">${s.county} Co.</div></td>
        <td class="s-num win-num">${rec.w}</td>
        <td class="s-num loss-num">${rec.l}</td>
        <td class="s-pct">${rec.gp?pct:'–'}</td>
        <td class="s-num">${rec.pf||'–'}</td>
        <td class="s-num">${rec.pa||'–'}</td>`;
      tbody.appendChild(tr);
    });

    section.appendChild(table);
    container.appendChild(section);
  });
  appendMediaSections(container);
}

/* ========== MAP TAB ========== */
let map,layers,allMarkers;
function initMap(){
  map=L.map('map',{scrollWheelZoom:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:18}).addTo(map);
  layers={IL:L.layerGroup(),MO:L.layerGroup(),KY:L.layerGroup(),TN:L.layerGroup()};
  allMarkers=[];
  schools.forEach(s=>{
    if(!layers[s.state]||isNaN(s.lat)||isNaN(s.lng)) return;
    const icon=L.divIcon({className:`pin pin-${s.state.toLowerCase()}`,iconSize:[13,13]});
    const marker=L.marker([s.lat,s.lng],{icon});
    const sid=schoolId(s.name);
    const popup=L.popup({className:'',maxWidth:220}).setContent(
      `<div class="pop-name"><a href="#" onclick="goToSchedule('${sid}');return false;">${s.name}</a></div>
       <div class="pop-loc">${s.county} Co., ${s.state}</div>
       ${s.coop?'<div class="pop-note">Co-op</div>':''}
       <div class="pop-sched-hint">↗ Tap name to view schedule</div>`
    );
    marker.bindPopup(popup);
    marker.addTo(layers[s.state]);
    allMarkers.push(marker);
  });
  Object.values(layers).forEach(l=>l.addTo(map));
  if(allMarkers.length) map.fitBounds(L.featureGroup(allMarkers).getBounds(),{padding:[32,32],maxZoom:9});
  else map.setView([37.3,-89.2],7);
  const activeStates=new Set(Object.keys(layers));
  function updateCount(){
    document.getElementById('count').textContent=`Showing ${schools.filter(s=>activeStates.has(s.state)).length} of ${schools.length}`;
  }
  updateCount();
  document.querySelectorAll('.controls .chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const st=chip.dataset.state,pressed=chip.getAttribute('aria-pressed')==='true';
      if(pressed){map.removeLayer(layers[st]);activeStates.delete(st);chip.setAttribute('aria-pressed','false');}
      else{map.addLayer(layers[st]);activeStates.add(st);chip.setAttribute('aria-pressed','true');}
      updateCount();
    });
  });
}

/* ========== HIGHLIGHTS TAB ========== */
async function buildHighlights(){
  const container=document.getElementById('highlightsContent');
  container.innerHTML='';

  if(!VIDEOS_CSV_URL||VIDEOS_CSV_URL.indexOf('REPLACE_WITH')!==-1){
    container.innerHTML=`<div class="hl-setup">
      <b>Almost there!</b> To activate the video link list:<br>
      1. In your Google Sheet, create a new tab named <code>Videos</code><br>
      2. Add these column headers: <code>Date</code> &nbsp;<code>Title</code> &nbsp;<code>URL</code> &nbsp;<code>Source</code> &nbsp;<code>Note</code><br>
      3. File → Share → Publish to web → select the <b>Videos</b> tab → format <b>CSV</b> → Publish<br>
      4. Paste the link into <code>VIDEOS_CSV_URL</code> near the top of the script in this file
    </div>`;
    appendMediaSections(container);
    return;
  }

  try{
    const res=await fetch(VIDEOS_CSV_URL,{cache:'no-store'});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const csvText=await res.text();
    const parsed=Papa.parse(csvText,{header:true,skipEmptyLines:true});
    const rows=parsed.data.map(raw=>{
      const r={};
      Object.keys(raw).forEach(k=>{r[k.trim()]=raw[k];});
      return {
        date:(r.Date||'').trim(),
        title:(r.Title||'').trim(),
        url:(r.URL||'').trim(),
        source:(r.Source||'KFVS12').trim(),
        note:(r.Note||'').trim(),
        thumb:(r.Thumbnail||r.thumbnail||r.Image||r.image||'').trim(),
        ms:r.Date?dateMs(r.Date):0
      };
    }).filter(r=>r.title&&r.url);

    if(!rows.length){
      container.innerHTML='<p class="hl-empty">No highlights posted yet — check back after Week 1.</p>';
      return;
    }

    // group by week
    const weekMap=new Map();
    rows.forEach(r=>{
      const wk=weekStart(r.date);
      if(!weekMap.has(wk)) weekMap.set(wk,[]);
      weekMap.get(wk).push(r);
    });
    const weekKeys=Array.from(weekMap.keys()).sort((a,b)=>b-a); // newest first

    weekKeys.forEach(wk=>{
      const section=document.createElement('section');
      section.className='hl-week';
      const h2=document.createElement('h2');
      const isCurrent=wk===currentWeekKey;
      h2.innerHTML=weekLabel(wk)+(isCurrent?' <span class="this-week-badge">This Week</span>':'');
      section.appendChild(h2);

      const grid=document.createElement('div');
      grid.className='hl-grid';

      weekMap.get(wk).sort((a,b)=>b.ms-a.ms).forEach(r=>{
        const card=document.createElement('a');
        card.className='hl-card';
        card.href=r.url;
        card.target='_blank';
        card.rel='noopener noreferrer';
        const thumbHtml=r.thumb
          ? `<img class="hl-thumb" src="${r.thumb}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="hl-icon" style="display:none"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>`
          : `<div class="hl-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>`;
        card.innerHTML=`
          ${thumbHtml}
          <div class="hl-body">
            <div class="hl-title">${r.title}</div>
            <div class="hl-meta">
              <span class="hl-source">${r.source}</span>
              ${r.date?`<span class="hl-date">${fmtDate(r.date)}</span>`:''}
            </div>
            ${r.note?`<div class="hl-note">${r.note}</div>`:''}
          </div>
          <div class="hl-arrow">↗</div>`;
        grid.appendChild(card);
      });

      section.appendChild(grid);
      container.appendChild(section);
    });

  }catch(err){
    console.error('Highlights load failed:',err);
    container.innerHTML=`<p class="hl-empty">Couldn't load highlights — check that the Videos sheet tab is published as CSV. (${err.message})</p>`;
  }

  // Always append YouTube channel embed + social links regardless of CSV status
  appendMediaSections(container);
}

/* ========== MAP → SCHEDULE DEEP LINK ========== */
function goToSchedule(sid){
  // close any open popup
  if(map) map.closePopup();
  // clear search so browse view is visible
  const search=document.getElementById('schedSearch');
  if(search&&search.value){
    search.value='';
    search.dispatchEvent(new Event('input'));
  }
  // switch to schedules tab
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelector('[data-tab="schedules"]').classList.add('active');
  document.getElementById('view-schedules').classList.add('active');
  // scroll to the card
  setTimeout(()=>{
    const el=document.getElementById(sid);
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
    // brief highlight pulse so it's obvious which card we landed on
    if(el){
      el.style.transition='box-shadow .15s ease';
      el.style.boxShadow='0 0 0 2px var(--amber)';
      setTimeout(()=>{el.style.boxShadow='';},1400);
    }
  },80);
}

/* ========== TAB SWITCHING ========== */
let scoresScrolled=false;
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`view-${btn.dataset.tab}`).classList.add('active');
    if(btn.dataset.tab==='map'&&map) setTimeout(()=>map.invalidateSize(),50);
    if(btn.dataset.tab==='scores'&&!scoresScrolled&&currentWeekKey!==null){
      scoresScrolled=true;
      setTimeout(()=>{const el=document.getElementById(`wk-${currentWeekKey}`);if(el)el.scrollIntoView({block:'start'});},50);
    }
  });
});

/* ========== LOAD & INIT ========== */
async function loadAndInit(){
  if(!SHEET_CSV_URL||SHEET_CSV_URL.indexOf('REPLACE_WITH')!==-1){
    setStatus('error','This page needs a data source. In Google Sheets: <b>File → Share → Publish to web</b>, choose this tab and <b>CSV</b> format, click <b>Publish</b>, then paste that link into the <code>SHEET_CSV_URL</code> constant near the top of the script.');
    document.getElementById('twLabel').textContent='No data source';
    document.getElementById('count').textContent='No data source set';
    return;
  }
  setStatus('loading','Loading schedule data from the sheet…');
  try{
    const res=await fetch(SHEET_CSV_URL,{cache:'no-store'});
    if(!res.ok) throw new Error(`Sheet fetch failed (HTTP ${res.status})`);
    const csv=await res.text();
    const parsed=Papa.parse(csv,{header:true,skipEmptyLines:true});
    schools=rowsToSchools(parsed.data);
    if(!schools.length) throw new Error('No rows parsed — check column headers match exactly.');
    setStatus('','');
    document.getElementById('schedSearch').disabled=false;
    updateScoreboard();
    updateChipLabels();
    buildThisWeek();
    buildSchedules();
    buildScoresTab();
    buildStandings();
    buildHighlights();
    buildDirectory();
    initMap();
  }catch(err){
    console.error(err);
    setStatus('error',`Couldn't load schedule data: ${err.message}.`);
    document.getElementById('twLabel').textContent='Data load failed';
    document.getElementById('count').textContent='Data load failed';
  }
}
loadAndInit();
